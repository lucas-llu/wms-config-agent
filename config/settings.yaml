project:
  name: wms-config-agent
  environment: development

llm:
  provider: disabled
  model: null

embedding:
  provider: disabled
  model: null

splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 150

vector_store:
  backend: memory
  persist_path: data/db/vector_store

retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 5

rerank:
  backend: none
  model: null
  top_m: 30

evaluation:
  backends:
    - custom
  golden_test_set: tests/fixtures/golden_test_set.json

observability:
  enabled: true
  trace_file: logs/traces.jsonl
