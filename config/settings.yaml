project:
  name: wms-config-agent
  environment: development

llm:
  provider: disabled
  model: null

embedding:
  provider: local_lsa
  model: tfidf-svd
  dimensions: 256
  batch_size: 32
  cache_dir: data/models/local_lsa

splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 150

vector_store:
  backend: chroma
  persist_path: data/db/chroma
  collection_name: wms_config_chunks

retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 5
  rrf_k: 60
  max_chunks_per_document: 2
  min_fused_score: 0.02

rerank:
  backend: none
  model: null
  top_m: 30

evaluation:
  backends:
    - custom
  golden_test_set: tests/fixtures/golden_test_set.json

observability:
  enabled: true
  trace_file: logs/traces.jsonl
