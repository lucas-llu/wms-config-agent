[project]
name = "wms-config-agent"
version = "0.1.0"
description = "Citation-first WMS and JDA MOCA configuration knowledge agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wms-config-agent = "main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

