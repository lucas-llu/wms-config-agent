name: quality

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Event secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Complete-history secret scan
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
      - name: Working-tree secret scan
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --redact --no-banner /repo
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts main.py
      - name: Format check
        run: python -m ruff format --check src tests scripts main.py
      - name: Test with coverage gate
        run: >-
          python -m pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - name: Public sanitized benchmark gate
        run: python -m pytest tests/e2e/test_recall_benchmark.py -q
