name: quality

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts main.py
      - name: Format check
        run: python -m ruff format --check src tests scripts main.py
      - name: Test with coverage gate
        run: >-
          python -m pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
